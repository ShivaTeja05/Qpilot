name: release

# A tag `vX.Y.Z` checks that the committed page is what its source builds, builds the wheel and the
# sdist (in a job that runs no npm), checks them, installs the wheel on Windows, macOS and Linux
# and runs the demo's Studio checks from it, then (1) publishes to PyPI through Trusted
# Publishing and (2) attaches both files to a GitHub Release.
#
# PyPI accepts the upload only from this repository's workflow, environment `pypi` (Trusted
# Publishing: docs/release.md, "One-time setup"; no token is ever stored). A `v*` tag publishes;
# an admin stops publishing with the repository variable PYPI_PUBLISH = false (the tag then still
# builds, checks and creates the GitHub Release). "Run workflow" (workflow_dispatch) builds and checks without a tag or a release;
# choosing `testpypi` rehearses the upload on test.pypi.org (environment `testpypi`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Rehearse the upload (needs a Trusted Publisher on test.pypi.org)"
        type: choice
        options: ["none", "testpypi"]
        default: "none"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The page inside the wheel is committed, not built at release: it must be what its source
  # makes. Checked in a job of its own, so no npm package's install script runs where the files
  # that are published are built (the build job below runs no npm at all).
  page:
    name: the committed page is what frontend/ builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build the page and compare
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../qpilot/web/static
          test -z "$(git status --porcelain -- ../qpilot/web/static)"

  build:
    name: build and check
    needs: page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The files are what they should be, and the tag names this version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/check_dist.py dist --tag "$REF_NAME"
          else
            python scripts/check_dist.py dist
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # A failure here stops the release: the wheel is installed and run on all three systems.
  smoke:
    name: installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the wheel into a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/smoke/Scripts/python.exe"; else PY="$RUNNER_TEMP/smoke/bin/python"; fi
          echo "SMOKE_PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install "$(ls dist/*.whl)[studio,sim]"
      - name: Smoke test, from outside the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$SMOKE_PY" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --full'

  github-release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "qPilot $TAG"

  pypi:
    name: publish to PyPI
    # Only a tag publishes; an admin switches it off with PYPI_PUBLISH = false (docs/release.md).
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH != 'false'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qpilot
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, there is no token to leak
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    name: rehearse on TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qpilot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
