# MIQE 2.0 item map: which checklist items an Analysis Record can answer, and from what.
#
# Source: Bustin SA, Ruijter JM, van den Hoff MJB, et al. MIQE 2.0: Revision of the Minimum
# Information for Publication of Quantitative Real-Time PCR Experiments Guidelines.
# Clin Chem 2025;71(6):634-651. doi:10.1093/clinchem/hvaf043 (Table 1).
# Labels are short paraphrases for finding an item; Table 1 of the paper has the exact wording.
# The published table is unnumbered: ids such as "5.13" are qPilot's section.position ids.
# Its columns are "Provided" (Yes or No) and "Description/Justification" (if Yes, the location
# or value; if No, the rationale). MIQE 2.0 has no essential/desirable split.
# Item list from research note 14 (KQ1), confirmed by `scientist` (53 items: 8/13/7/6/19).
# Classes below are qPilot's own triage, not part of MIQE; reports never quote class counts.
# Footnotes encoded in the resolvers: c (sequences highly desirable, else assay context
# sequences), d (section 3 and parts of 5 may not apply), e (no-RT control desirable, no longer
# essential once DNA-free), f (reagent details), j (efficiency-corrected quantities necessary).
#
# class: a = from the RDML file plus the engine; b = from instrument/QC exports or a lab profile;
#        c = a short per-study form; d = only a person can attest (never answered by qPilot).
# fill:  the resolver in qpilot/report/miqe.py that answers the item from the record, or null
#        (then the item "needs the scientist"). A resolver that finds nothing in the record
#        also leaves the item to the scientist, with a hint of what the record does hold.
# The report counts items "filled from the record" and never calls a study compliant.
schema: qpilot.miqe2_items/1
name: miqe2-items
version: "1.0.0"
reviewed_by: scientist (bus #0052, 19 Oct 2026)
citation: >-
  Bustin SA, Ruijter JM, van den Hoff MJB, Kubista M, Pfaffl MW, Shipley GL, Tran N, Rödiger S,
  Untergasser A, Mueller R, Nolan T, Milavec M, Burns MJ, Huggett JF, Vandesompele J, Wittwer CT.
  MIQE 2.0: Revision of the Minimum Information for Publication of Quantitative Real-Time PCR
  Experiments Guidelines. Clin Chem 2025;71(6):634-651. doi:10.1093/clinchem/hvaf043
sections:
  "1": Reagent preparation
  "2": Sample preparation
  "3": Reverse transcription
  "4": qPCR protocol
  "5": Data analysis
