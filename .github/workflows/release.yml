name: release

# A tag `vX.Y.Z` builds the wheel and the sdist, checks them, installs the wheel on Windows, macOS
# and Linux and runs the demo's Studio checks from it, then (1) publishes to PyPI through Trusted
# Publishing and (2) attaches both files to a GitHub Release.
#
# Nothing is published until you set it up once (docs/release.md, "One-time setup"):
#   * PyPI: add this repository as a Trusted Publisher of the project (no token is ever stored);
#   * GitHub: create the environment `pypi`, and the repository variable PYPI_PUBLISH = true.
# Until PYPI_PUBLISH is set, a tag still builds, checks and creates the GitHub Release; the PyPI
# job is skipped. "Run workflow" (workflow_dispatch) builds and checks without a tag or a release;
# choosing `testpypi` rehearses the upload on test.pypi.org (environment `testpypi`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Rehearse the upload (needs a Trusted Publisher on test.pypi.org)"
        type: choice
        options: ["none", "testpypi"]
        default: "none"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The page inside the wheel is committed, not built here: it must be what its source makes.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: The committed page is what frontend/ builds
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../qpilot/web/static
          test -z "$(git status --porcelain -- ../qpilot/web/static)"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The files are what they should be, and the tag names this version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/check_dist.py dist --tag "$REF_NAME"
          else
            python scripts/check_dist.py dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # A failure here stops the release: the wheel is installed and run on all three systems.
  smoke:
    name: installed wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the wheel into a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/smoke/Scripts/python.exe"; else PY="$RUNNER_TEMP/smoke/bin/python"; fi
          echo "SMOKE_PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install "$(ls dist/*.whl)[studio,sim]"
      - name: Smoke test, from outside the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: '"$SMOKE_PY" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --full'

  github-release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "qPilot $TAG"

  pypi:
    name: publish to PyPI
    # Inert until the repository variable PYPI_PUBLISH is "true" (docs/release.md, "One-time setup").
    if: github.ref_type == 'tag' && vars.PYPI_PUBLISH == 'true'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qpilot
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, there is no token to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: rehearse on TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qpilot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
