name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version the project's environment and .pre-commit-config.yaml use: change all three together.
  RUFF_VERSION: "0.17.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==${{ env.RUFF_VERSION }}"
      - run: ruff format --check .
      - run: ruff check .

  # The unit tests on the three systems qPilot is used on. Python 3.11 is the floor the project
  # declares; 3.13 is run on Linux only. Tests needing the downloaded demo dataset run locally and
  # in the installed-wheel job below.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,ai]"
      # UTF-8 mode only for the tests' own file reads and writes (the test code uses the
      # system's default encoding, which on Windows is cp1252). What qPilot itself does under a
      # non-UTF-8 code page is pinned by tests/core/test_portability.py, which starts a child
      # process with PYTHONUTF8=0, and by the installed-wheel job, which sets nothing.
      - run: pytest -q -m "not demo_data"
        env:
          PYTHONUTF8: "1"

  # The wheel and the sdist, built the way a release builds them and checked as archives.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # What a user gets: the wheel installed into a clean environment and run from a folder that is
  # not the repository (scripts/smoke_installed.py: the console scripts, the page, the API, an .xlsx;
  # --full also fetches the pinned demo and runs the Studio checks).
  smoke:
    name: installed wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11", full: false }
          - { os: ubuntu-latest, python: "3.12", full: true }
          - { os: macos-latest, python: "3.12", full: true }
          - { os: windows-latest, python: "3.12", full: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/smoke/Scripts/python.exe"; else PY="$RUNNER_TEMP/smoke/bin/python"; fi
          echo "SMOKE_PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install "$(ls dist/*.whl)[studio,sim]"
      - name: Smoke test, from outside the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          if [ "${{ matrix.full }}" = true ]; then
            "$SMOKE_PY" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --full
          else
            "$SMOKE_PY" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          local: true

  # The one page: type-checked, linted, unit-tested and built; the build committed in
  # qpilot/web/static must be exactly what this source produces (pip users never need Node).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ..
      - run: npm ci
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- ../qpilot/web/static
      - run: npm audit --omit=dev --audit-level=high
