# Research use only. Rules are lab-editable examples with sources; they are not clinical run-validity rules.
#
# qPilot Run Gate v0 rule pack for academic gene-expression work. Thresholds and their sources come
# from agent-bus/contracts/scientist-spec-gate.md (scientist, 18 Oct 2026); quotes marked verified
# there were re-read on that date. Edit a copy: change the version, set based_on to this pack's
# hash (qpilot gate rules diff shows what changed), and point qpilot gate --pack at it.
#
# 1.1.0 (21 Oct 2026): G-RT and G-INSTR, origin/main's gate lines (qpcr/gate_rt.py,
# qpcr/gate_instr.py), are rules of the pack: sourced, with their thresholds as parameters, a
# verdict per biological unit x target (G-RT) and per plate (G-INSTR), and the consequence test
# where they point at wells. The rules of 1.0.0 are unchanged.
#
# 1.2.0 (28 Oct 2026): G-MELT, melt curves of DNA-binding-dye assays (qpcr/melt.py,
# methods/melt_curve.md): one product at the assay's melting temperature per amplified study
# well, and what melted in each no-template control. G-NTC-1 now grades a control's amplification
# with G-MELT's class of its product (a primer-dimer gives its 'tainted_dimer' warning, as the
# 1.0.0 severity already allowed) when the file has melt curves; without them it is unchanged.
# The rules of 1.1.0 are otherwise unchanged.
#
# 1.3.0 (28 Oct 2026): G-IPC, the internal positive control of multiplex wells (qpcr/multiplex.py,
# docs/multiplex.md): a study well whose IPC comes up delay_cycles or more later than in the
# no-template wells suggests inhibition. G-NTC-1 no longer judges an internal positive control
# (it is meant to amplify in the no-template wells); it is unchanged for every other target. The
# rules of 1.2.0 are otherwise unchanged.
pack: research-default
version: 1.3.0
label: >-
  Research use only. Rules are lab-editable examples with sources; they are not clinical
  run-validity rules.
consequence: {magnitude_log2: 0.5, magnitude_agreement: 0.10}
sources:
  miqe2:
    citation: >-
      Bustin SA, Ruijter JM, van den Hoff MJB, et al. MIQE 2.0: revision of the Minimum
      Information for Publication of Quantitative Real-Time PCR Experiments guidelines.
      Clin Chem 2025;71(6):634-651.
    url: https://doi.org/10.1093/clinchem/hvaf043
  ruiz_villalba_2021:
    citation: >-
      Ruiz-Villalba A, Ruijter JM, van den Hoff MJB. Use and misuse of Cq in qPCR data analysis
      and reporting. Life 2021;11(6):496.
    url: https://doi.org/10.3390/life11060496
  bar_2003:
    citation: >-
      Bar T, Stahlberg A, Muszta A, Kubista M. Kinetic Outlier Detection (KOD) in real-time PCR.
      Nucleic Acids Res 2003;31(17):e105.
    url: https://doi.org/10.1093/nar/gng106
  ma_2021:
    citation: >-
      Ma H, Bell KN, Loker RN. qPCR and qRT-PCR analysis: regulatory points to consider when
      conducting biodistribution and vector shedding studies. Mol Ther Methods Clin Dev
      2021;20:152-168 (Table 4).
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7786041/
  laurell_2012:
    citation: >-
      Laurell H, Iacovoni JS, Abot A, et al. Correction of RT-qPCR data for genomic DNA-derived
      signals with ValidPrime. Nucleic Acids Res 2012;40(7):e51. Grade cut-offs applied here to
      a no-RT estimate (a qPilot adaptation, not the ValidPrime method).
    url: https://doi.org/10.1093/nar/gkr1259
  biorad_5279:
    citation: Bio-Rad. Real-Time PCR Applications Guide, Bulletin 5279 (R2 > 0.980).
  primepcr_6262:
    citation: >-
      Hellemans J, Vandesompele J, et al. PrimePCR assays: meeting the MIQE guidelines by full
      wet-lab validation. Bio-Rad Bulletin 6262 (efficiency 90-110 %).
  run_validity_analogy:
    citation: >-
      By analogy with clinical run-validity practice (e.g. the CDC 2019-nCoV RT-PCR panel
      instructions). Cited to explain the rule; research-default does not copy clinical rules.
  bustin_2015:
    citation: >-
      Bustin S, Dhillon HS, Kirvell S, et al. Variability of the reverse transcription step:
      practical implications. Clin Chem 2015;61(1):202-212 (published online 2014).
    url: https://doi.org/10.1373/clinchem.2014.230615
    note: >-
      The RT-replicate delta Cq < 1 criterion as quoted in qPilot's research notes
      (04-preanalytics-qc-gates.md); to be checked against the paper before it is cited
      (SOLVABLE-ERRORS-PLAN section 7, fact 3). The paper gives it as a criterion for choosing a
      reverse transcriptase; G-RT applies the same line to each biological unit and target.
  vendor_run_file:
    citation: >-
      The instrument's own run file (a QuantStudio or StepOne .eds, a QuantStudio results export,
      CFX run information): the run state, the event log and each calibration's expiry as the
      vendor's software wrote them. qPilot reads them (methods/instrument_context.md) and adds no
      threshold of its own.
  rdmlpython_melt:
    citation: >-
      RDML consortium, rdmlpython (MIT), Run.meltCurveAnalysis: a peak within the expected
      melting temperature +/- truePeakWidth (default 1.0 C) is the product, and peaks below
      peakCutoff (default 5 % of the summed peak heights) are not counted. Untergasser A, Ruijter
      JM, Benes V, van den Hoff MJB. Web-based LinRegPCR: application for the visualization and
      analysis of (RT)-qPCR amplification and melting data. BMC Bioinformatics 2021;22:398.
    url: https://doi.org/10.1186/s12859-021-04306-1
  ririe_1997:
    citation: >-
      Ririe KM, Rasmussen RP, Wittwer CT. Product differentiation by analysis of DNA melting
      curves during the polymerase chain reaction. Anal Biochem 1997;245(2):154-160: the
      negative derivative of the melt curve (-dF/dT) peaks at each product's melting
      temperature; primer-dimers melt lower than the product.
    url: https://doi.org/10.1006/abio.1996.9916
  miqe_2009:
    citation: >-
      Bustin SA, Benes V, Garson JA, et al. The MIQE guidelines: minimum information for
      publication of quantitative real-time PCR experiments. Clin Chem 2009;55(4):611-622: the
      checklist asks for inhibition testing (Cq dilutions, spike or other).
    url: https://doi.org/10.1373/clinchem.2008.112797
  lab_default:
    citation: Unsourced, lab-editable default (qPilot project convention).
rules:
  - id: G-TYPED
    name: Typed controls on the plate
    check: typed_controls
    statement: >-
      A plate with no wells typed as controls (no-template, no-RT, no-amplification, positive,
      standard) cannot be gated; it is shown as ungated, loudly, until its controls are typed.
    applies_to: {sample_types: [ntc, nac, ntp, nrt, pos, std], per: [plate]}
    needs: [sample_type]
    severity: {typed: pass, untyped: fail, no_controls_confirmed: warn}
    default_action: log
    sources: [miqe2]
  - id: G-NTC-1
    name: No-template control amplification near the study samples
    check: ntc_gap
    statement: >-
      When a negative control shows amplification, a study sample counts as positive only if its
      Cq precedes the earliest amplifying control's by at least k cycles; samples closer than
      that are flagged, with the share of their signal such contamination could contribute.
    applies_to: {sample_types: [ntc, ntp], per: [plate, target]}
    needs: [engine_call, cq, eff_target]
    params: {k_cycles: 5}
    severity: {clean: pass, amplified_clear: warn, tainted_dimer: warn, tainted: fail}
    consequence_scope: [exclude_flagged]
    default_action: card
    sources: [miqe2]
  - id: G-NAC
    name: Amplification in a no-amplification control
    check: nac_amplified
    statement: >-
      Signal in a no-amplification control means the target's signal on this plate may not
      depend on amplification; every study well of that target on the plate is flagged.
    applies_to: {sample_types: [nac], per: [plate, target]}
    needs: [engine_call]
    severity: {clean: pass, amplified: fail}
    consequence_scope: [exclude_target_plate]
    default_action: card
    sources: [run_validity_analogy]
  - id: G-NRT
    name: Genomic DNA share from the no-RT control
    check: nrt_gdna
    statement: >-
      The genomic-DNA share of a sample's signal is estimated as E^-(Cq no-RT - Cq RT) and graded
      A (< 3 %), B (3-25 %), C (25-60 %) or F (> 60 %). No correction is applied.
    applies_to: {sample_types: [nrt], per: [plate, target, sample]}
    needs: [engine_call, cq, eff_target]
    params: {grade_a_max: 0.03, grade_b_max: 0.25, grade_c_max: 0.60}
    severity: {grade_a: pass, grade_b: warn, grade_c: fail, grade_f: fail}
    consequence_scope: [exclude_sample_target]
    default_action: card
    sources: [laurell_2012, miqe2]
  - id: G-POS
    name: Positive control inside its window
    check: pos_window
    statement: >-
      A positive control is checked against a Cq window the lab sets for that control; without a
      mapped control and window the rule is not applicable.
    applies_to: {sample_types: [pos], per: [plate, target]}
    needs: [cq, control_window]
    severity: {inside: pass, outside: fail}
    default_action: card
    sources: [lab_default]
  - id: G-STD
    name: Standard curve
    check: std_curve
    statement: >-
      Cq is regressed on log10 quantity over the amplified standard wells; efficiency
      10^(-1/slope) with its 95 % confidence interval must fall inside the window and R2 above
      the minimum, with at least three levels. In relative quantification a failure does not
      taint study samples; it marks the curve as an efficiency source.
    applies_to: {sample_types: [std], per: [plate, target]}
    needs: [cq, template_quantity]
    params:
      efficiency_min_pct: 90
      efficiency_max_pct: 110
      r2_min: 0.980
      min_levels: 3
      min_replicates: 3
    severity: {ok: pass, few_replicates: warn, efficiency_out: fail, r2_low: fail}
    default_action: log
    sources: [ma_2021, primepcr_6262, biorad_5279, miqe2]
  - id: G-REP
    name: Technical replicate spread
    check: replicate_spread
    statement: >-
      The Cq range of n replicate wells is compared with the 95th percentile of the range of n
      normal values whose SD combines pipetting (CV c) and Poisson sampling (1/N copies):
      sqrt(c^2 + 1/N) / ln(E). Copies come from a standard curve on the plate; without one, only
      pipetting counts up to Cq 30, a two-cycle floor applies up to Cq 35, and later groups are
      not evaluated. Outside the range is a warning; the consequence test decides.
    applies_to: {sample_types: [unkn, pos, std], per: [plate, target, sample]}
    needs: [cq, eff_target]
    params:
      pipetting_cv: 0.15
      low_copy_tolerance_cycles: 2.0
      copies_unknown_max_cq: 30
      stochastic_min_cq: 35
      plate_share_max: 0.10
    severity: {within: pass, outside: warn, many_outside: warn}
    consequence_scope: [drop_outlier_well, drop_sample]
    default_action: card
    sources: [ruiz_villalba_2021, bar_2003, lab_default]
  - id: G-RT
    name: Reverse-transcription replicate spread
    check: rt_replicate_spread
    statement: >-
      Where the design marks reverse-transcription replicates (samples of one biological unit
      reverse-transcribed separately from the same RNA: the sample sheet's rt_replicate column),
      each replicate's Cq is the mean Cq of its study wells, and the range between the replicates
      of one unit and target must stay below the limit. A range at or above it is a warning; the
      consequence test decides. Without annotated replicates the rule is not applicable: the
      spread of reverse transcription is not measured.
    applies_to: {sample_types: [unkn], per: [unit, target]}
    needs: [cq, rt_replicate]
    params: {limit_cycles: 1.0}
    severity: {rt_within_limit: pass, rt_over_limit: warn}
    consequence_scope: [exclude_unit_target, drop_rt_replicate]
    default_action: card
    sources: [bustin_2015]
  - id: G-INSTR
    name: What the run file says about the run
    check: instrument_run
    statement: >-
      For each plate, its run file says whether the run completed, whether it was paused or a lid
      or drawer opened (and in which cycles), which calibrations were past the vendor's expiry at
      run time, and whether a hold drifted from its setpoint by more than the lab's limit. Each of
      these is a warning to weigh, not a reason to set the run aside: the consequence test says
      whether leaving the run's study wells out changes a call. The study's own file (RDML) names
      the instrument and the run date at most; a person links the instrument's run file to a
      plate to check the rest.
    applies_to: {per: [plate]}
    needs: [run_context]
    params: {hold_limit_c: 0.5}
    severity:
      run_complete: pass
      run_not_complete: warn
      interrupted: warn
      aborted_in_log: warn
      power_event: warn
      no_interruptions: pass
      calibration_expired: warn
      calibrations_in_date: pass
      hold_off_setpoint: warn
      hold_on_setpoint: pass
    consequence_scope: [exclude_run]
    default_action: card
    sources: [vendor_run_file, lab_default]
  - id: G-MELT
    name: One product at the assay's melting temperature
    check: melt_products
    statement: >-
      For SYBR Green and other DNA-binding dyes with a melt curve. Each well's melt curve is
      differentiated (-dF/dT, smoothed) and its peaks found; a peak lower than noise_share of the
      assay's typical product peak on the plate is not counted. The assay's expected melting
      temperature is the one the file declares for the target, else the median main-peak
      temperature of the target's amplified study wells on the plate (at least min_wells of
      them; a qPilot convention). Each study sample's amplified wells should melt as one product
      within tm_tolerance_c of it: a main peak further away, or no peak, means no product at the
      expected temperature (fail); an extra peak carrying at least extra_peak_share of the well's
      summed peak heights means a mixture, such as a primer-dimer beside the product (warn); the
      consequence test leaves the flagged wells out. In a no-template control, a peak at the
      product's temperature is a contamination candidate and a higher one another product
      (warn); only lower peaks are a primer-dimer candidate, usually harmless there (pass);
      G-NTC-1 grades the control's amplification with this class. A single peak at the expected
      temperature does not guarantee the intended amplicon (MIQE 2.0). Without melt curves, or
      for a probe chemistry, the rule is not applicable.
    applies_to:
      sample_types: [unkn, pos, std, ntc, ntp]
      per: [plate, target, sample]
      chemistry: [dna_binding_dye]
    needs: [melt_curve, engine_call]
    params: {tm_tolerance_c: 1.0, extra_peak_share: 0.05, noise_share: 0.05, min_wells: 3}
    severity:
      one_product: pass
      extra_peak: warn
      tm_off: fail
      no_peak: fail
      ntc_clean: pass
      ntc_dimer: pass
      ntc_other_product: warn
      ntc_product: warn
    consequence_scope: [exclude_flagged]
    default_action: card
    sources: [rdmlpython_melt, ririe_1997, miqe2, lab_default]
  - id: G-IPC
    name: Internal positive control (inhibition)
    check: ipc_inhibition
    statement: >-
      For multiplex wells with an internal positive control (a target named IPC, IAC or internal
      positive/amplification control, measured in the same wells as the study's targets). The
      control is added at the same amount to every reaction, so its Cq should be about the same in
      every well. Its expected Cq is the median over the no-template wells where it amplified, or,
      with fewer than min_reference_wells of them, over the plate's study wells. A study well whose
      control comes up delay_cycles or more later suggests inhibition (warn), as does a well where
      neither the control nor any target amplified, which cannot be told from a negative (warn).
      A control that did not amplify beside a target that did is not inhibition: a strongly
      amplifying target can use up the reaction first. The consequence test leaves out the flagged
      wells, every curve of each. Without an internal positive control the rule is not applicable.
    applies_to: {sample_types: [unkn, ntc, ntp], per: [plate, target]}
    needs: [cq, engine_call, internal_positive_control]
    params: {delay_cycles: 3.0, min_reference_wells: 2}
    severity: {ipc_ok: pass, ipc_delayed: warn, ipc_failed: warn}
    consequence_scope: [exclude_inhibited]
    default_action: card
    sources: [miqe_2009, miqe2, lab_default]
