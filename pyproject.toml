[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qpilot"
version = "0.1.0"
description = "Open, validated qPCR analysis that shows which of your choices could change the conclusion. Research use only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "qPilot contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Every dependency for both development tracks is declared here at T0 so that
# nobody needs to edit this file during the build (see team/00-TEAM-PLAN-OVERVIEW.md).
dependencies = [
  "lxml>=6.1.3",
  "numpy",
  "scipy",
  "pandas",
  "pydantic>=2",
  "mcp>=1.23.0",
  "gradio>=5",
  "plotly",
  "pyyaml",
  "filelock",
  # Imported at module level by the vendored rdmlpython (melt-curve plots qPilot never calls).
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-socket",
  "ruff",
  "mypy",
  "pre-commit",
  "pip-licenses",
  "cyclonedx-bom",
]
ai = ["anthropic", "httpx"]
parquet = ["pyarrow"]
xlsx = ["openpyxl"]
# qPilot Studio: sample sheets. The Curve Judge model ships as JSON and runs on numpy;
# xgboost is needed only to retrain it (training/curve_judge/requirements.txt).
studio = ["openpyxl"]
# Decision Simulator (qsim, vendored from ShivaTeja05/qpilot-simulator @ dad5a15 into sim/):
# `qsim run` writes results/grid.parquet. Everything else qsim imports is already a core dependency.
sim = ["pyarrow"]

[project.scripts]
qpilot = "qpilot.cli:main"
qsim = "qsim.cli:main"

[tool.hatch.build.targets.wheel]
# sim/src/qsim installs as the top-level package `qsim`. Its data/ and results/ stay in sim/
# and are found relative to the source tree, so run qsim from an editable install or a clone.
packages = ["qpilot", "sim/src/qsim"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures/*.rdml", "demo/*.mp4"]
