line-length = 100
target-version = "py311"
# research_notes/ are the researchers' documents: their code snippets are quoted, not ours to format.
extend-exclude = ["qpilot/vendor", "research_notes"]
# Respect the exclusion even when pre-commit passes file names explicitly.
force-exclude = true

[lint]
select = ["E", "F", "I", "B", "UP", "D"]
# Docstrings are required on public API only; these pydocstyle checks are too strict for that.
ignore = ["D105", "D107", "D203", "D213"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D"]
# Vendored byte-for-byte from qpilot-simulator (its own config: E,F,I,UP,B, E501 off, no D).
"sim/**" = ["D", "E501", "I001"]  # I001: qsim sorted qpilot as third-party

[format]
quote-style = "double"
