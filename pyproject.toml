[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qpilot"
version = "0.1.0"
description = "Open qPCR analysis, benchmarked against published results, that shows which of your choices could change the conclusion. Research use only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "qPilot contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Every dependency for both development tracks is declared here at T0 so that
# nobody needs to edit this file during the build (see team/00-TEAM-PLAN-OVERVIEW.md).
dependencies = [
  "lxml>=6.1.3",
  "numpy",
  "scipy",
  "pandas",
  "pydantic>=2",
  "mcp>=1.23.0",
  # The one page (qpilot app): a local FastAPI server; the page itself is prebuilt into
  # qpilot/web/static, so installing qPilot never needs Node.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "plotly",
  "pyyaml",
  "filelock",
  # Imported at module level by the vendored rdmlpython (melt-curve plots qPilot never calls).
  "matplotlib",
  # The Decision Simulator (sim/, installed as qsim) writes its analysis grid as parquet.
  # Core, so that "Decision Simulator installed" always means an audit can run.
  "pyarrow",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-socket",
  "ruff",
  "mypy",
  "pre-commit",
  "pip-licenses",
  "cyclonedx-bom",
]
ai = ["anthropic", "httpx"]
parquet = ["pyarrow"]
xlsx = ["openpyxl"]
# qPilot Studio: sample sheets. The Curve Judge model ships as JSON and runs on numpy;
# xgboost is needed only to retrain it (training/curve_judge/requirements.txt).
studio = ["openpyxl"]
# Decision Simulator (qsim, merged into sim/ with its history at dad5a15). Kept so that
# `pip install -e '.[sim]'` keeps working; pyarrow is now a core dependency.
sim = ["pyarrow"]

[project.scripts]
qpilot = "qpilot.cli:main"
qsim = "qsim.cli:main"

[tool.hatch.build.targets.wheel]
# sim/src/qsim installs as the top-level package `qsim`. Its data/ and results/ stay in sim/
# and are found relative to the source tree, so run qsim from an editable install or a clone.
packages = ["qpilot", "sim/src/qsim"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures/*.rdml", "demo/*.mp4", "frontend/node_modules"]
