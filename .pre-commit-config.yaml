# The built page (qpilot/web/static) is generated by `npm run build`; hooks never edit it.
# The ruff rev is the version CI pins (.github/workflows/ci.yml, RUFF_VERSION): change both together.
exclude: ^qpilot/web/static/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|qpilot/vendor/)
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|qpilot/vendor/)
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
